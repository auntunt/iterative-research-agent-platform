<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">系统总览图</title>
  <desc id="desc">迭代式深度研究 Agent 平台从用户输入到报告输出的架构总览。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#17212b}
      .title{font-size:42px;font-weight:800}
      .label{font-size:25px;font-weight:700}
      .small{font-size:21px;fill:#485465}
      .box{fill:#fff;stroke:#b8c4d2;stroke-width:2.5;rx:18}
      .agent{fill:#ecfdf5;stroke:#10b981}
      .tool{fill:#eff6ff;stroke:#3b82f6}
      .store{fill:#fef3c7;stroke:#d97706}
      .line{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="85" class="title">迭代式深度研究 Agent 平台</text>
  <text x="72" y="126" class="small">从开放问题到可追溯研究报告</text>
  <rect x="70" y="210" width="170" height="92" class="box"/><text x="105" y="266" class="label">用户输入</text>
  <rect x="290" y="210" width="210" height="92" class="box"/><text x="322" y="266" class="label">前端工作台</text>
  <rect x="550" y="210" width="180" height="92" class="box"/><text x="590" y="266" class="label">FastAPI</text>
  <rect x="780" y="210" width="170" height="92" class="box"/><text x="825" y="266" class="label">任务队列</text>
  <rect x="1000" y="195" width="280" height="122" class="box"/><text x="1048" y="250" class="label">LangGraph</text><text x="1043" y="283" class="small">Orchestrator</text>
  <rect x="1330" y="210" width="200" height="92" class="box"/><text x="1372" y="266" class="label">研究报告</text>
  <path d="M240 256 H290" class="line"/><path d="M500 256 H550" class="line"/><path d="M730 256 H780" class="line"/><path d="M950 256 H1000" class="line"/><path d="M1280 256 H1330" class="line"/>
  <rect x="260" y="420" width="180" height="86" class="agent"/><text x="305" y="473" class="label">Planner</text>
  <rect x="500" y="420" width="220" height="86" class="agent"/><text x="532" y="473" class="label">并行 Researcher</text>
  <rect x="780" y="420" width="180" height="86" class="agent"/><text x="835" y="473" class="label">Critic</text>
  <rect x="1020" y="420" width="180" height="86" class="agent"/><text x="1072" y="473" class="label">Writer</text>
  <path d="M440 463 H500" class="line"/><path d="M720 463 H780" class="line"/><path d="M960 463 H1020" class="line"/>
  <rect x="250" y="610" width="220" height="78" class="tool"/><text x="292" y="658" class="label">SearXNG</text>
  <rect x="505" y="610" width="220" height="78" class="tool"/><text x="548" y="658" class="label">Playwright</text>
  <rect x="760" y="610" width="220" height="78" class="tool"/><text x="800" y="658" class="label">DuckDuckGo</text>
  <rect x="1015" y="610" width="220" height="78" class="tool"/><text x="1065" y="658" class="label">Crawl4AI</text>
  <rect x="1270" y="610" width="220" height="78" class="tool"/><text x="1318" y="658" class="label">Web Fetch</text>
  <text x="70" y="650" class="label">工具链</text>
  <rect x="270" y="760" width="210" height="70" class="store"/><text x="315" y="804" class="small">SQLite 任务库</text>
  <rect x="530" y="760" width="210" height="70" class="store"/><text x="586" y="804" class="small">Trace 日志</text>
  <rect x="790" y="760" width="210" height="70" class="store"/><text x="842" y="804" class="small">MemoryStore</text>
  <rect x="1050" y="760" width="210" height="70" class="store"/><text x="1100" y="804" class="small">RAG 向量库</text>
  <text x="70" y="804" class="label">持久化</text>
</svg>
