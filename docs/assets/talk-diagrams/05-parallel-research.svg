<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">并行 Researcher</title>
  <desc id="desc">Planner 将开放问题拆成五个主题，并行交给 Researcher 执行。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#17212b}.title{font-size:42px;font-weight:800}.label{font-size:25px;font-weight:800}.small{font-size:20px;fill:#52606d}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2.5;rx:18}.topic{fill:#eff6ff;stroke:#3b82f6}.worker{fill:#ecfdf5;stroke:#10b981}.cards{fill:#fef3c7;stroke:#d97706}.line{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="82" class="title">开放问题到并行 Researcher</text>
  <rect x="70" y="360" width="240" height="120" class="box"/><text x="116" y="414" class="label">用户问题</text><text x="102" y="450" class="small">开放式研究主题</text>
  <rect x="390" y="350" width="220" height="140" class="box"/><text x="446" y="414" class="label">Planner</text><text x="430" y="450" class="small">拆成可检索子题</text>
  <path d="M310 420 H390" class="line"/>
  <g>
    <rect x="700" y="120" width="220" height="72" class="topic"/><text x="758" y="164" class="label">概念边界</text>
    <rect x="700" y="240" width="220" height="72" class="topic"/><text x="758" y="284" class="label">经验证据</text>
    <rect x="700" y="360" width="220" height="72" class="topic"/><text x="758" y="404" class="label">权衡风险</text>
    <rect x="700" y="480" width="220" height="72" class="topic"/><text x="758" y="524" class="label">工程实现</text>
    <rect x="700" y="600" width="220" height="72" class="topic"/><text x="758" y="644" class="label">趋势展望</text>
  </g>
  <path d="M610 420 C650 270 665 165 700 156" class="line"/><path d="M610 420 C660 350 665 280 700 276" class="line"/><path d="M610 420 H700" class="line"/><path d="M610 420 C660 485 665 510 700 516" class="line"/><path d="M610 420 C650 590 665 635 700 636" class="line"/>
  <g>
    <rect x="1010" y="120" width="240" height="72" class="worker"/><text x="1056" y="164" class="label">Researcher 1</text>
    <rect x="1010" y="240" width="240" height="72" class="worker"/><text x="1056" y="284" class="label">Researcher 2</text>
    <rect x="1010" y="360" width="240" height="72" class="worker"/><text x="1056" y="404" class="label">Researcher 3</text>
    <rect x="1010" y="480" width="240" height="72" class="worker"/><text x="1056" y="524" class="label">Researcher 4</text>
    <rect x="1010" y="600" width="240" height="72" class="worker"/><text x="1056" y="644" class="label">Researcher 5</text>
  </g>
  <path d="M920 156 H1010" class="line"/><path d="M920 276 H1010" class="line"/><path d="M920 396 H1010" class="line"/><path d="M920 516 H1010" class="line"/><path d="M920 636 H1010" class="line"/>
  <rect x="1340" y="350" width="200" height="140" class="cards"/><text x="1375" y="414" class="label">Evidence</text><text x="1395" y="450" class="label">Cards</text>
  <path d="M1250 156 C1310 220 1315 330 1340 380" class="line"/><path d="M1250 276 C1300 305 1320 350 1340 390" class="line"/><path d="M1250 396 H1340" class="line"/><path d="M1250 516 C1300 500 1320 465 1340 440" class="line"/><path d="M1250 636 C1310 590 1320 500 1340 455" class="line"/>
</svg>
