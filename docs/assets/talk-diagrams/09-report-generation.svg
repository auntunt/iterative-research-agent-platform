<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">报告生成</title>
  <desc id="desc">Writer 将证据卡片转化为正式 Markdown 研究报告。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#17212b}.title{font-size:42px;font-weight:800}.label{font-size:26px;font-weight:800}.small{font-size:20px;fill:#52606d}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2.5;rx:18}.card{fill:#fef3c7;stroke:#d97706}.writer{fill:#eff6ff;stroke:#3b82f6}.report{fill:#ecfdf5;stroke:#10b981}.line{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="82" class="title">证据卡片到正式研究报告</text>
  <g>
    <rect x="90" y="210" width="260" height="86" class="card"/><text x="128" y="262" class="label">EvidenceCard 1</text>
    <rect x="90" y="330" width="260" height="86" class="card"/><text x="128" y="382" class="label">EvidenceCard 2</text>
    <rect x="90" y="450" width="260" height="86" class="card"/><text x="128" y="502" class="label">EvidenceCard 3</text>
    <rect x="90" y="570" width="260" height="86" class="card"/><text x="128" y="622" class="label">EvidenceCard N</text>
  </g>
  <rect x="520" y="260" width="320" height="130" class="writer"/><text x="618" y="320" class="label">Writer</text><text x="570" y="358" class="small">引用草稿生成</text>
  <rect x="520" y="500" width="320" height="130" class="writer"/><text x="608" y="560" class="label">最终润色</text><text x="565" y="598" class="small">正式书面报告</text>
  <path d="M350 253 C420 260 455 300 520 315" class="line"/><path d="M350 373 C420 365 455 335 520 330" class="line"/><path d="M350 493 C420 500 455 545 520 565" class="line"/><path d="M350 613 C420 610 455 590 520 580" class="line"/>
  <path d="M680 390 V500" class="line"/>
  <rect x="1030" y="190" width="420" height="500" class="report"/>
  <text x="1130" y="250" class="label">Markdown 研究报告</text>
  <line x1="1080" y1="280" x2="1400" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1092" y="330" class="small">摘要</text>
  <text x="1092" y="380" class="small">引言</text>
  <text x="1092" y="430" class="small">正文章节</text>
  <text x="1092" y="480" class="small">局限与待研究问题</text>
  <text x="1092" y="530" class="small">结论</text>
  <text x="1092" y="580" class="small">引用索引 [1][2][3]</text>
  <path d="M840 565 C940 560 970 430 1030 430" class="line"/>
  <text x="420" y="760" class="small">内部结构：证据卡片、引用、段落 ID</text>
  <text x="940" y="760" class="small">最终产物：面向读者的正式报告</text>
</svg>
