<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">证据卡片生成</title>
  <desc id="desc">网页正文经过清洗、段落切分和研究摘要后生成 EvidenceCard。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#17212b}.title{font-size:42px;font-weight:800}.label{font-size:25px;font-weight:800}.small{font-size:20px;fill:#52606d}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2.5;rx:18}.step{fill:#eff6ff;stroke:#3b82f6}.card{fill:#fff;stroke:#d97706;stroke-width:3;rx:18}.line{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="82" class="title">网页内容到证据卡片</text>
  <rect x="80" y="220" width="260" height="360" class="box"/>
  <text x="130" y="272" class="label">网页正文</text>
  <text x="118" y="325" class="small">Markdown</text>
  <text x="118" y="366" class="small">HTML 段落</text>
  <text x="118" y="407" class="small">搜索 snippet</text>
  <rect x="430" y="210" width="220" height="90" class="step"/><text x="468" y="265" class="label">噪音过滤</text>
  <rect x="430" y="365" width="220" height="90" class="step"/><text x="468" y="420" class="label">段落切分</text>
  <rect x="430" y="520" width="220" height="90" class="step"/><text x="462" y="575" class="label">LLM 摘要</text>
  <path d="M340 400 C390 330 390 260 430 255" class="line"/><path d="M340 400 H430" class="line"/><path d="M340 400 C390 475 390 565 430 565" class="line"/>
  <rect x="780" y="185" width="360" height="460" class="card"/>
  <text x="895" y="242" class="label">EvidenceCard</text>
  <line x1="820" y1="270" x2="1100" y2="270" stroke="#e2e8f0" stroke-width="2"/>
  <text x="825" y="320" class="small">claim：研究发现</text>
  <text x="825" y="370" class="small">summary：研究摘要</text>
  <text x="825" y="420" class="small">citation.url：来源地址</text>
  <text x="825" y="470" class="small">paragraph_id：段落 ID</text>
  <text x="825" y="520" class="small">snippet：原始摘录</text>
  <text x="825" y="570" class="small">confidence：置信度</text>
  <path d="M650 255 C715 255 735 300 780 315" class="line"/><path d="M650 410 C715 410 735 390 780 390" class="line"/><path d="M650 565 C715 565 735 520 780 500" class="line"/>
  <rect x="1230" y="285" width="260" height="230" class="box"/>
  <text x="1278" y="344" class="label">Writer 输入</text>
  <text x="1262" y="400" class="small">只吃结构化证据</text>
  <text x="1262" y="442" class="small">避免网页快照堆砌</text>
  <path d="M1140 415 H1230" class="line"/>
</svg>
