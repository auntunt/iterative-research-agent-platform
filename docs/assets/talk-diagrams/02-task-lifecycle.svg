<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">任务生命周期</title>
  <desc id="desc">深度研究任务从提交、检索、审查到报告和 RAG 入库的生命周期。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#17212b}.title{font-size:42px;font-weight:800}.label{font-size:22px;font-weight:800}.small{font-size:19px;fill:#56616f}.box{fill:#fff;stroke:#c3ccd8;stroke-width:2.3;rx:16}.line{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#arrow)}.loop{stroke:#f97316;stroke-width:4;fill:none;marker-end:url(#arrow)}.store{fill:#fef3c7;stroke:#d97706}.review{fill:#fff7ed;stroke:#f97316}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="82" class="title">深度研究任务生命周期</text>
  <text x="72" y="122" class="small">每一步都有状态、日志和可追溯产物</text>
  <g>
    <rect x="70" y="210" width="150" height="78" class="box"/><text x="102" y="258" class="label">提交问题</text>
    <rect x="260" y="210" width="150" height="78" class="box"/><text x="292" y="258" class="label">创建任务</text>
    <rect x="450" y="210" width="150" height="78" class="box"/><text x="490" y="258" class="label">入队</text>
    <rect x="640" y="210" width="150" height="78" class="box"/><text x="665" y="258" class="label">Planner</text>
    <rect x="830" y="210" width="180" height="78" class="box"/><text x="865" y="258" class="label">Researcher</text>
    <rect x="1050" y="210" width="150" height="78" class="box"/><text x="1092" y="258" class="label">Critic</text>
    <rect x="1240" y="210" width="150" height="78" class="box"/><text x="1285" y="258" class="label">Writer</text>
  </g>
  <path d="M220 249 H260" class="line"/><path d="M410 249 H450" class="line"/><path d="M600 249 H640" class="line"/><path d="M790 249 H830" class="line"/><path d="M1010 249 H1050" class="line"/><path d="M1200 249 H1240" class="line"/>
  <rect x="830" y="390" width="180" height="72" class="box"/><text x="864" y="435" class="label">搜索工具</text>
  <rect x="830" y="510" width="180" height="72" class="box"/><text x="864" y="555" class="label">正文抓取</text>
  <rect x="830" y="630" width="180" height="72" class="box"/><text x="858" y="675" class="label">证据卡片</text>
  <path d="M920 288 V390" class="line"/><path d="M920 462 V510" class="line"/><path d="M920 582 V630" class="line"/>
  <path d="M1050 230 C990 120 790 120 720 205" class="loop"/><text x="845" y="150" class="small">证据不足：追加检索</text>
  <rect x="1240" y="390" width="180" height="72" class="review"/><text x="1274" y="435" class="label">Human Review</text>
  <path d="M1125 288 C1135 360 1190 415 1240 426" class="loop"/><path d="M1330 390 V288" class="line"/>
  <rect x="1240" y="640" width="180" height="72" class="store"/><text x="1284" y="685" class="label">导出产物</text>
  <rect x="1010" y="760" width="220" height="72" class="store"/><text x="1068" y="805" class="label">RAG 入库</text>
  <path d="M1315 288 V640" class="line"/><path d="M1240 676 C1110 680 1120 735 1120 760" class="loop"/><path d="M1010 795 C740 820 690 690 830 666" class="loop"/><text x="610" y="820" class="small">后续任务可命中缓存</text>
</svg>
