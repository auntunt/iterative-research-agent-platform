<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">上下文管理</title>
  <desc id="desc">Agent 上下文管理的分层结构：原始事件、证据窗口、滚动摘要和长期记忆。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#17212b}.title{font-size:42px;font-weight:800}.label{font-size:26px;font-weight:800}.small{font-size:20px;fill:#52606d}.layer{stroke:#b8c4d2;stroke-width:2.5;rx:18}.line{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="82" class="title">Agent 上下文管理分层</text>
  <rect x="250" y="620" width="700" height="90" class="layer" fill="#fff"/><text x="300" y="675" class="label">原始事件和工具输出</text>
  <rect x="250" y="500" width="700" height="90" class="layer" fill="#eff6ff"/><text x="300" y="555" class="label">证据窗口 evidence_window</text>
  <rect x="250" y="380" width="700" height="90" class="layer" fill="#ecfdf5"/><text x="300" y="435" class="label">滚动摘要 rolling_summary</text>
  <rect x="250" y="260" width="700" height="90" class="layer" fill="#fef3c7"/><text x="300" y="315" class="label">长期记忆 long_term_memory</text>
  <path d="M600 620 V590" class="line"/><path d="M600 500 V470" class="line"/><path d="M600 380 V350" class="line"/>
  <rect x="1080" y="305" width="300" height="120" fill="#fff" stroke="#cbd5e1" stroke-width="2.5" rx="18"/>
  <text x="1148" y="360" class="label">Token Budget</text><text x="1138" y="395" class="small">只放必要内容</text>
  <path d="M950 545 C1040 535 1050 395 1080 365" class="line"/>
  <rect x="1070" y="520" width="330" height="120" fill="#fff7ed" stroke="#f97316" stroke-width="2.5" rx="18"/>
  <text x="1120" y="575" class="label">Summarizer</text><text x="1105" y="610" class="small">每个 Agent step 后异步更新</text>
  <path d="M950 665 H1070" class="line"/><path d="M1235 520 C1220 450 1005 440 950 425" class="line"/>
</svg>
