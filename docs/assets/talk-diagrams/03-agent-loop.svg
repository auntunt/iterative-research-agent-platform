<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop</title>
  <desc id="desc">Agent 的 Plan、Act、Observe 闭环以及统一输出 AgentRun。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#17212b}.title{font-size:44px;font-weight:800}.label{font-size:30px;font-weight:800}.small{font-size:23px;fill:#52606d}.box{fill:#fff;stroke:#b8c4d2;stroke-width:2.5;rx:18}.act{fill:#eff6ff;stroke:#3b82f6}.observe{fill:#ecfdf5;stroke:#10b981}.plan{fill:#fef3c7;stroke:#d97706}.line{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="86" class="title">Agent Loop：Plan → Act → Observe</text>
  <circle cx="620" cy="440" r="245" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="510" y="170" width="220" height="92" class="plan"/><text x="565" y="226" class="label">Plan</text><text x="538" y="258" class="small">目标与工具</text>
  <rect x="300" y="430" width="220" height="92" class="act"/><text x="360" y="486" class="label">Act</text><text x="328" y="518" class="small">执行动作</text>
  <rect x="720" y="430" width="250" height="92" class="observe"/><text x="774" y="486" class="label">Observe</text><text x="752" y="518" class="small">检查结果</text>
  <path d="M540 250 C390 300 355 385 390 430" class="line"/>
  <path d="M520 476 H720" class="line"/>
  <path d="M805 430 C835 330 760 250 720 220" class="line"/>
  <rect x="150" y="630" width="240" height="76" class="act"/><text x="202" y="677" class="small">LLM 生成</text>
  <rect x="430" y="630" width="240" height="76" class="act"/><text x="480" y="677" class="small">工具调用</text>
  <path d="M405 522 L290 630" class="line"/><path d="M440 522 L520 630" class="line"/>
  <rect x="840" y="630" width="290" height="76" class="observe"/><text x="878" y="677" class="small">工具是否成功</text>
  <rect x="1180" y="630" width="290" height="76" class="observe"/><text x="1218" y="677" class="small">是否需要重试</text>
  <path d="M850 522 L980 630" class="line"/><path d="M900 522 L1320 630" class="line"/>
  <rect x="1090" y="210" width="360" height="250" class="box"/>
  <text x="1180" y="268" class="label">AgentRun</text>
  <text x="1132" y="322" class="small">output</text>
  <text x="1132" y="365" class="small">llm_usage</text>
  <text x="1132" y="408" class="small">tool_calls</text>
  <text x="1132" y="451" class="small">routing_decisions</text>
  <path d="M970 476 C1060 470 1090 415 1090 360" class="line"/>
</svg>
